version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # @types/node tracks the Node.js major the project runs on (24 in CI).
      # A newer major would type APIs that do not exist at run time; move it
      # together with node-version in ci.yml, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
